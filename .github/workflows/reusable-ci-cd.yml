name: Reusable Build and manage version

on:
  workflow_call:

jobs:
  build:
    runs-on: [self-hosted]
    # Dynamically set environment based on branch
    environment: ${{ github.ref_name == 'develop' && 'development' || github.ref_name == 'staging' && 'staging' || github.ref_name == 'qa' && 'qa'}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to custom Docker registry
        uses: docker/login-action@v3
        with:
          registry: azspshacr01-d4asfndmh8h2epbp.azurecr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with dynamic tag
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: azspshacr01-d4asfndmh8h2epbp.azurecr.io/infocontrol/ai-middleware:latest-${{ github.run_id }}
      - name: Run Trivy scan on private image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: 'azspshacr01-d4asfndmh8h2epbp.azurecr.io/infocontrol/ai-middleware:latest-${{ github.run_id }}'
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'
          ignore-unfixed: true
          # vuln-type: 'os,library'
      - name: Upload Trivy report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json-report
          path: trivy-report.json

