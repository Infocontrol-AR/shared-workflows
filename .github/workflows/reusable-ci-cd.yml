name: Reusable Build and manage version

on:
  workflow_call:
    inputs:
      DOCKER_REGISTRY:
        description: 'DOCKER_REGISTRY'
        required: true
        type: string
      DOCKER_REGISTRY_SHORT:
        description: 'DOCKER_REGISTRY_SHORT'
        required: true
        type: string
      DOCKER_IMAGE_NAME:
        description: 'DOCKER_IMAGE_NAME'
        required: true
        type: string
      # DOCKER_TAG:
      #  description: 'DOCKER_TAG with which to tag the image'
      #  required: true
      #  type: string
      FROZEN_ENVIRONMENT:
        description: 'Whether to deploy after build'
        required: false
        type: string
        default: 'false'  
      VERSION_FILE_NAME:
        description: 'File name with the version of the application'
        required: true
        type: string
      REPOSITORY_NAME:
        description: 'Name of the repository which is being built'
        required: true
        type: string
      environment: 
        description: 'Deployment environment'
        required: true
        type: string
    secrets:

      SSH_PASSWORD:
        description: 'SSH_PASSWORD for deployment server'
        required: true
      SSH_IP:
        description: 'SSH_IP for deployment server'
        required: true 
      DOCKER_USERNAME:
        description: 'DOCKER_USERNAME'
        required: true
      DOCKER_PASSWORD:
        description: 'DOCKER_PASSWORD'
        required: true
      AZURE_STORAGE_ACCOUNT_NAME:
        description: 'AZURE_STORAGE_ACCOUNT_NAME'
        required: true
      AZURE_STORAGE_CONNECTION_STRING:
        description: 'AZURE_STORAGE_CONNECTION_STRING'
        required: true
      AZURE_STORAGE_CONTAINER_NAME:
        description: 'AZURE_STORAGE_CONTAINER_NAME'
        required: true
      AZURE_STORAGE_SAS_TOKEN:
        description: 'AZURE_STORAGE_SAS_TOKEN'
        required: true
      EMBEDDING_MODEL:
        description: 'EMBEDDING_MODEL'
        required: true
      FIREWORKS_API_KEY:
        description: 'FIREWORKS_API_KEY'
        required: true
      FIREWORKS_MODEL:
        description: 'FIREWORKS_MODEL'
        required: true
      FW_API_KEY:
        description: 'FW_API_KEY'
        required: true
      FW_ENDPOINT:
        description: 'FW_ENDPOINT'
        required: true
      FW_MODEL:
        description: 'FW_MODEL'
        required: true
      LLAMAPARSE_API_KEY:
        description: 'LLAMAPARSE_API_KEY'
        required: true
      QDRANT_API_KEY:
        description: 'QDRANT_API_KEY'
        required: true
      QDRANT_URL:
        description: 'QDRANT_URL'
        required: true
      UNSTRUCTURED_API_KEY:
        description: 'UNSTRUCTURED_API_KEY'
        required: true
      UNSTRUCTURED_API_URL:
        description: 'UNSTRUCTURED_API_URL'
        required: true

jobs:

  pre-build:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    outputs:
      version: ${{ steps.compute_version.outputs.version }}
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - id: compute_version
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          if [ "$ref" = "develop" ]; then
            echo "version=latest-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          elif [ "$ref" = "qa" ] || [ "$ref" = "staging" ]; then
            python3 /devops-tools/versionmanager.py increase ${{ vars.VERSION_FILE_NAME}}          
            export version=$(python3 /devops-tools/versionmanager.py get ${{ vars.VERSION_FILE_NAME}})
            export version="$(echo "$version" | tr -d '\r' | xargs)"
            git config --global user.email "devops@achilles.com"
            git config --global user.name "Achilles DevOps Bot"
            git tag -a $version -m "Tag $version created automatically"
            git add .
            git commit -m "NOTICKET: Increasing version number"
            cat ${{ vars.VERSION_FILE_NAME}}
            git push --tags
            git push origin $ref
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "version=unknown" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    needs: pre-build
    # environment: ${{ github.ref_name == 'develop' && 'development' || github.ref_name == 'staging' && 'staging' || github.ref_name == 'qa' && 'qa'}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to custom Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.DOCKER_REGISTRY }} 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with dynamic tag
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:${{ needs.pre-build.outputs.version }} # latest-${{ github.run_id }}
      - name: Run Trivy scan on private image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:${{ needs.pre-build.outputs.version }}' # latest-${{ github.run_id }}'
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'
          ignore-unfixed: true
          # vuln-type: 'os,library'
      - name: Upload Trivy report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json-report
          path: trivy-report.json

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run tests and generate reports
        run: |
          pytest tests/test_examples.py --junitxml=test-results.xml
          coverage run -m pytest tests/test_examples.py --junitxml=test-results.xml
          coverage xml -o coverage.xml
          coverage report
          bandit -r . -f json -o bandit-report.json || true

      - name: Upload XML files
        uses: actions/upload-artifact@v4
        with:
          name: xml-reports
          path: "*.xml"
          retention-days: 30
          if-no-files-found: warn    
      - name: Set up SonarQube project
        run: |
          # Create project and get token
          PROJECT_KEY="${{ github.event.repository.name }}"
          # Create project (using default admin credentials)
          curl -u admin:admin -X POST "http://localhost:9000/api/projects/create?project=${PROJECT_KEY}&name=${PROJECT_KEY}"
          echo "http://localhost:9000/api/projects/create?project=${PROJECT_KEY}&name=${PROJECT_KEY}"

          # Generate user token for analysis
          echo  "http://localhost:9000/api/user_tokens/generate?name=github-actions-${GITHUB_RUN_ID}"
          curl -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=github-actions" -vvv
          TOKEN_RESPONSE=$(curl -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=github-actions-${GITHUB_RUN_ID}")
          TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.token')
          echo "SONAR_TOKEN=${TOKEN}"
          echo "PROJECT_KEY=${PROJECT_KEY}"

          /github/workspace/sonar/bin/sonar-scanner \
            -Dsonar.projectKey=${PROJECT_KEY} \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=${TOKEN} \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.python.xunit.reportPath=test-results.xml \
            -Dsonar.python.bandit.reportPaths=bandit-report.json \
            -Dsonar.exclusions=tests/**,venv/**,env/**,**/__pycache__/**
          sleep 30
          QUALITY_GATE=$(curl -u ${TOKEN}: "http://localhost:9000/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" | jq -r '.projectStatus.status')
        
          echo "Quality Gate Status: $QUALITY_GATE"       
          if [ "$QUALITY_GATE" != "OK" ]; then
            echo "Quality Gate failed!"
            echo "Ignoring errors for now, change next line to 'exit 1' to enforce quality gate."
            exit 0
          fi
  deploy:
    needs: [build, pre-build]
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    # if: ${{ vars.ENVIRONMENT_FROZEN == 'true'}} 
    steps:
      - run: | 
          export DOCKER_REGISTRY=${{ inputs.DOCKER_REGISTRY }}
          export DOCKER_IMAGE_NAME=${{ inputs.DOCKER_IMAGE_NAME }}
          export VERSION=${{ needs.pre-build.outputs.version }}
          echo "${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}:${VERSION}"
          
          if [[ "${{ vars.ENVIRONMENT_FROZEN }}" == "true" ]]; then
            echo "Environment is frozen. Skipping deployment."
            exit 0
          fi
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -tt -o StrictHostKeyChecking=no neteng@${{ secrets.SSH_IP }} << 'EOF'

            echo "Running on remote machine..."
            echo "Releasing ${{ needs.pre-build.outputs.version }}"
            echo "Environment is frozen: ${{ vars.ENVIRONMENT_FROZEN }}"
            docker system prune -af
            
            docker login ${{ inputs.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            cd workspace

            if [ ! -d "${{ github.event.repository.name }}" ]; then
                echo "Folder does not exist, clonning code..."
                git clone git@github.com:${{ github.repository }}.git
                cd ${{ github.event.repository.name }}
                git checkout ${{ github.ref_name }}
            else
                echo "Folder already exists. Initializing Git inside existing folder..."

                REPO_URL="git@github.com:AI-ACHILLES/ai-middleware-v3.git"
                echo "Repo URL: $REPO_URL"

                cd ${{ github.event.repository.name }} || { echo "Cannot cd into FOLDER"; exit 1; }
                git config --global init.defaultBranch main
                git init
                
                git remote add origin "$REPO_URL"
                
                git pull
                git checkout -b "${{ github.ref_name }}" origin/"${{ github.ref_name }}"
            fi
            mv .env.example .env
            sed -i "s|QDRANT_URL=.*|QDRANT_URL=${{ secrets.QDRANT_URL }}|g" .env
            sed -i "s|QDRANT_API_KEY=.*|QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}|g" .env
            sed -i "s|EMBEDDING_MODEL=.*|EMBEDDING_MODEL=${{ secrets.EMBEDDING_MODEL }}|g" .env
 
            sed -i "s|AZURE_STORAGE_SAS_TOKEN=.*|AZURE_STORAGE_SAS_TOKEN=${{ secrets.AZURE_STORAGE_SAS_TOKEN }}|g" .env
            sed -i "s|AZURE_STORAGE_ACCOUNT_NAME=.*|AZURE_STORAGE_ACCOUNT_NAME=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}|g" .env
            sed -i "s|AZURE_STORAGE_CONTAINER_NAME=.*|AZURE_STORAGE_CONTAINER_NAME=${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}|g" .env
 
            sed -i "s|UNSTRUCTURED_API_URL=.*|UNSTRUCTURED_API_URL=${{ secrets.UNSTRUCTURED_API_URL }}|g" .env
            sed -i "s|UNSTRUCTURED_API_KEY=.*|UNSTRUCTURED_API_KEY=${{ secrets.UNSTRUCTURED_API_KEY }}|g" .env
 
            sed -i "s|LLAMAPARSE_API_KEY=.*|LLAMAPARSE_API_KEY=${{ secrets.LLAMAPARSE_API_KEY }}|g" .env
 
            sed -i "s|FIREWORKS_API_KEY=.*|FIREWORKS_API_KEY=${{ secrets.FIREWORKS_API_KEY }}|g" .env
            sed -i "s|FIREWORKS_MODEL=.*|FIREWORKS_MODEL=${{ secrets.FIREWORKS_MODEL }}|g" .env

            sed -i "s|FW_API_KEY=.*|FW_API_KEY=${{ secrets.FW_API_KEY }}|g" .env
            sed -i "s|FW_ENDPOINT=.*|FW_ENDPOINT=${{ secrets.FW_ENDPOINT }}|g" .env
            sed -i "s|FW_MODEL=.*|FW_MODEL=${{ secrets.FW_MODEL }}|g" .env
            sed -i "s|DEBUG=.*|DEBUG=${{ vars.DEBUG }}|g" .env

            sed -i "s|DOCKER_REGISTRY=.*|DOCKER_REGISTRY=${{ inputs.DOCKER_REGISTRY }}|g" .env
            sed -i "s|DOCKER_IMAGE_NAME=.*|DOCKER_IMAGE_NAME=${{ inputs.DOCKER_IMAGE_NAME }}|g" .env
            sed -i "s|VERSION=.*|VERSION=${{ needs.pre-build.outputs.version }}|g" .env

            # cat .env
            
            set -a
            source .env
            set +a

            docker network create ${NETWORK_NAME} 2>/dev/null || echo "Network ${NETWORK_NAME} already exists"

            # Create volumes if they don't exist
            docker volume create ollama_data 2>/dev/null || echo "Volume ollama_data already exists"
            docker volume create huggingface-cache 2>/dev/null || echo "Volume huggingface-cache already exists"
            docker volume create middleware-consumer 2>/dev/null || echo "Volume middleware-consumer already exists"

            docker stop ${MIDDLEWARE_CONTAINER_NAME}
            # docker stop ${RAG_CONTAINER_NAME}
            # docker stop ${VECTORIZER_CONTAINER_NAME}
            docker stop embedding-service-ollama
            docker stop embedding-service-baai

            # Optional: remove containers
            docker rm ${MIDDLEWARE_CONTAINER_NAME}
            # docker rm ${RAG_CONTAINER_NAME}
            # docker rm ${VECTORIZER_CONTAINER_NAME}
            docker rm embedding-service-ollama
            docker rm embedding-service-baai

            echo "Building embedding-service-baai..."
            docker build \
              -t embedding-service:baai-bge-m3 \
              -f embedding-services/BAAI-bge-m3/Dockerfile \
              .

            echo "Running embedding-service-baai..."
            docker run -d \
              --name embedding-service-baai \
              --env-file .env \
              -e EMBEDDING_MODEL=${EMBEDDING_MODEL} \
              -e EMBEDDING_DEVICE=${EMBEDDING_DEVICE} \
              -e EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE} \
              -e EMBEDDING_SERVICE_PORT=${EMBEDDING_SERVICE_PORT} \
              -e PYTORCH_NUM_THREADS=${PYTORCH_NUM_THREADS} \
              -e OMP_NUM_THREADS=${OMP_NUM_THREADS} \
              -p ${EMBEDDING_SERVICE_PORT}:${EMBEDDING_SERVICE_PORT} \
              --network ${NETWORK_NAME} \
              --restart unless-stopped \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v huggingface-cache:/root/.cache/huggingface \
              --cpus="8.0" \
              --memory=8000m \
              --memory-reservation=4000m \
              --health-cmd="python -c \"import requests; requests.get('http://localhost:${EMBEDDING_SERVICE_PORT:-8025}/health', timeout=5).raise_for_status()\"" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=5 \
              --health-start-period=120s \
              embedding-service:baai-bge-m3

            echo "Building embedding-service-ollama..."
            docker build \
              -t embedding-service-ollama:latest \
              -f embedding-services/OLLAMA-bge-m3/Dockerfile \
              embedding-services/OLLAMA-bge-m3

            echo "Running embedding-service-ollama..."
            docker run -d \
              --name ${OLLAMA_CONTAINER_NAME} \
              -p ${OLLAMA_PORT}:11434 \
              -v ollama_data:/root/.ollama \
              --network ${NETWORK_NAME} \
              -e OLLAMA_DEBUG=false \
              -e OLLAMA_LOG_LEVEL=warn \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=2 \
              --restart unless-stopped \
              --cpus="2.0" \
              --memory=4096m \
              embedding-service-ollama:latest

            # Wait for embedding-service-baai to be healthy
            echo "Waiting for embedding-service-baai to be healthy..."
            until [ "$(docker inspect --format='{{.State.Health.Status}}' embedding-service-baai)" == "healthy" ]; do
              echo "Waiting for embedding-service-baai..."
              sleep 5
            done
            echo "embedding-service-baai is healthy!"

            #echo "Building vectorizer..."
            #docker build \
            #  -t ${VECTORIZER_CONTAINER_NAME}:latest \
            #  -f ../${VECTORIZER_FOLDER_NAME}/Dockerfile \
            #  ../${VECTORIZER_FOLDER_NAME}

            #echo "Running vectorizer..."
            #docker run -d \
            #  --name ${VECTORIZER_CONTAINER_NAME} \
            #  --env-file .env \
            #  --network ${NETWORK_NAME} \
            #  --restart no \
            #  -p ${VECTORIZER_PORT}:${VECTORIZER_PORT} \
            #  --cpus=${VECTORIZER_LIMIT_CPU} \
            #  --memory=${VECTORIZER_LIMIT_MEM}m \
            #  ${VECTORIZER_CONTAINER_NAME}:latest

            #echo "Building rag-service..."
            #docker build \
            #  -t ${RAG_CONTAINER_NAME}:latest \
            #  -f ../${RAG_FOLDER_NAME}/Dockerfile \
            #  ../${RAG_FOLDER_NAME}

            #echo "Running rag-service..."
            #docker run -d \
            #  --name ${RAG_CONTAINER_NAME} \
            #  --env-file .env \
            #  --network ${NETWORK_NAME} \
            #  --restart unless-stopped \
            #  -p ${RAG_SERVICE_PORT}:${RAG_SERVICE_PORT} \
            #  --cpus=${RAG_LIMIT_CPU} \
            #  --memory=${RAG_LIMIT_MEM}m \
            #  ${RAG_CONTAINER_NAME}:latest

            echo "Running middleware-consumer..."
            docker run -d \
              --name ${MIDDLEWARE_CONTAINER_NAME} \
              -p ${MIDDLEWARE_PORT}:8000 \
              --env-file .env \
              -e MODE=${MODE:-consumer} \
              --network ${NETWORK_NAME} \
              --restart ${RESTART_POLICY} \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v $(pwd):/app \
              -v /app/certs:/app/app/certs:ro \
              --cpus=${MIDDLEWARE_LIMIT_CPU} \
              --memory=${MIDDLEWARE_LIMIT_MEM}m \
              --health-cmd="python app/scripts/healthcheck_kafka.py" \
              --health-interval=30s \
              --health-timeout=10s \
              --health-retries=5 \
              --health-start-period=20s \
              ${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}:${VERSION}

            echo "All services started successfully!"
            echo "To view logs: docker logs -f <container-name>"
            echo "To stop all services: docker stop <container-names>"
            # docker compose down --rmi all --volumes --remove-orphans
            # docker compose up --build -d
            exit 0
          EOF
      - run: echo "Deployment completed successfully!"