name: Reusable Build and manage version

on:
  workflow_call:
    inputs:
      DOCKER_REGISTRY:
        description: 'DOCKER_REGISTRY'
        required: true
        type: string
      DOCKER_REGISTRY_SHORT:
        description: 'DOCKER_REGISTRY_SHORT'
        required: true
        type: string
      DOCKER_IMAGE_NAME:
        description: 'DOCKER_IMAGE_NAME'
        required: true
        type: string
      VERSION_FILE_NAME:
        description: 'File name with the version of the application'
        required: true
        type: string
      REPOSITORY_NAME:
        description: 'Name of the repository which is being built'
        required: true
        type: string
    secrets:
      DOCKER_USERNAME:
        description: 'DOCKER_USERNAME'
        required: true
      DOCKER_PASSWORD:
        description: 'DOCKER_PASSWORD'
        required: true

jobs:
  build:
    runs-on: [self-hosted]
    # Dynamically set environment based on branch
    environment: ${{ github.ref_name == 'develop' && 'development' || github.ref_name == 'staging' && 'staging' || github.ref_name == 'qa' && 'qa'}}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to custom Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.DOCKER_REGISTRY }} #azspshacr01-d4asfndmh8h2epbp.azurecr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with dynamic tag
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:latest-${{ github.run_id }}
      - name: Run Trivy scan on private image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:latest-${{ github.run_id }}'
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'
          ignore-unfixed: true
          # vuln-type: 'os,library'
      - name: Upload Trivy report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json-report
          path: trivy-report.json

