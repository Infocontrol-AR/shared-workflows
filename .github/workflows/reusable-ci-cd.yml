name: Reusable Build and manage version

on:
  workflow_call:
    inputs:
      DOCKER_REGISTRY:
        description: 'DOCKER_REGISTRY'
        required: true
        type: string
      DOCKER_REGISTRY_SHORT:
        description: 'DOCKER_REGISTRY_SHORT'
        required: true
        type: string
      DOCKER_IMAGE_NAME:
        description: 'DOCKER_IMAGE_NAME'
        required: true
        type: string

      DOCKERFILE_PATH:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      CONTAINER_NAME:
        description: 'Name of the main container'
        required: true
        type: string
      CONTAINER_PORT:
        description: 'Port of the main container'
        required: true
        type: string
      DEPLOYMENT_SCRIPT_PATH:
        description: 'Path to deployment script'
        required: true
        type: string
      FROZEN_ENVIRONMENT:
        description: 'Whether to deploy after build'
        required: false
        type: string
        default: 'false'  
      VERSION_FILE_NAME:
        description: 'File name with the version of the application'
        required: true
        type: string
      REPOSITORY_NAME:
        description: 'Name of the repository which is being built'
        required: true
        type: string
      environment: 
        description: 'Deployment environment'
        required: true
        type: string
    secrets:

      SSH_PASSWORD:
        description: 'SSH_PASSWORD for deployment server'
        required: true
      SSH_IP:
        description: 'SSH_IP for deployment server'
        required: true 
      DOCKER_USERNAME:
        description: 'DOCKER_USERNAME'
        required: true
      DOCKER_PASSWORD:
        description: 'DOCKER_PASSWORD'
        required: true
      AZURE_STORAGE_ACCOUNT_NAME:
        description: 'AZURE_STORAGE_ACCOUNT_NAME'
        required: true
      AZURE_STORAGE_CONNECTION_STRING:
        description: 'AZURE_STORAGE_CONNECTION_STRING'
        required: true
      AZURE_STORAGE_CONTAINER_NAME:
        description: 'AZURE_STORAGE_CONTAINER_NAME'
        required: true
      AZURE_STORAGE_SAS_TOKEN:
        description: 'AZURE_STORAGE_SAS_TOKEN'
        required: true
      EMBEDDING_MODEL:
        description: 'EMBEDDING_MODEL'
        required: true
      FIREWORKS_API_KEY:
        description: 'FIREWORKS_API_KEY'
        required: true
      FIREWORKS_MODEL:
        description: 'FIREWORKS_MODEL'
        required: true
      FW_API_KEY:
        description: 'FW_API_KEY'
        required: true
      FW_ENDPOINT:
        description: 'FW_ENDPOINT'
        required: true
      FW_MODEL:
        description: 'FW_MODEL'
        required: true
      LLAMAPARSE_API_KEY:
        description: 'LLAMAPARSE_API_KEY'
        required: true
      QDRANT_API_KEY:
        description: 'QDRANT_API_KEY'
        required: true
      QDRANT_URL:
        description: 'QDRANT_URL'
        required: true
      UNSTRUCTURED_API_KEY:
        description: 'UNSTRUCTURED_API_KEY'
        required: true
      UNSTRUCTURED_API_URL:
        description: 'UNSTRUCTURED_API_URL'
        required: true

jobs:

  pre-build:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    outputs:
      version: ${{ steps.compute_version.outputs.version }}
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
      - id: compute_version
        shell: bash
        run: |
          if [[ "${{ inputs.VERSION_FILE_NAME }}" == "None" ]]; then
            echo "Using hardcoded version."
            echo "version=bge-m3" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ref="${GITHUB_REF_NAME}"
          if [ "$ref" = "develop" ]; then
            echo "version=latest-${{ github.run_id }}" >> "$GITHUB_OUTPUT"
          elif [ "$ref" = "qa" ] || [ "$ref" = "staging" ]; then
            python3 /devops-tools/versionmanager.py increase ${{ vars.VERSION_FILE_NAME}}          
            export version=$(python3 /devops-tools/versionmanager.py get ${{ vars.VERSION_FILE_NAME}})
            export version="$(echo "$version" | tr -d '\r' | xargs)"
            git config --global user.email "devops@achilles.com"
            git config --global user.name "Achilles DevOps Bot"
            git tag -a $version -m "Tag $version created automatically"
            git add .
            git commit -m "NOTICKET: Increasing version number"
            cat ${{ vars.VERSION_FILE_NAME}}
            git push --tags
            git push origin $ref
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "version=unknown" >> "$GITHUB_OUTPUT"
          fi

  build:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    needs: pre-build
    # environment: ${{ github.ref_name == 'develop' && 'development' || github.ref_name == 'staging' && 'staging' || github.ref_name == 'qa' && 'qa'}}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to custom Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.DOCKER_REGISTRY }} 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with dynamic tag
        uses: docker/build-push-action@v5
        with:
          context: . #/embedding-services/BAAI-bge-m3
          file: ${{ inputs.DOCKERFILE_PATH }}
          push: true
          tags: ${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:${{ needs.pre-build.outputs.version }} # latest-${{ github.run_id }}
          
      - name: Run Trivy scan on private image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:${{ needs.pre-build.outputs.version }}' # latest-${{ github.run_id }}'
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'
          ignore-unfixed: true
          # vuln-type: 'os,library'
      - name: Upload Trivy report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json-report
          path: trivy-report.json

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Run tests and generate reports
        run: |
          pytest tests/test_examples.py --junitxml=test-results.xml
          coverage run -m pytest tests/test_examples.py --junitxml=test-results.xml
          coverage xml -o coverage.xml
          coverage report
          bandit -r . -f json -o bandit-report.json || true

      - name: Upload XML files
        uses: actions/upload-artifact@v4
        with:
          name: xml-reports
          path: "*.xml"
          retention-days: 30
          if-no-files-found: warn    
      - name: Set up SonarQube project
        run: |
          # Create project and get token
          PROJECT_KEY="${{ github.event.repository.name }}"
          # Create project (using default admin credentials)
          curl -u admin:admin -X POST "http://localhost:9000/api/projects/create?project=${PROJECT_KEY}&name=${PROJECT_KEY}"
          echo "http://localhost:9000/api/projects/create?project=${PROJECT_KEY}&name=${PROJECT_KEY}"

          # Generate user token for analysis
          echo  "http://localhost:9000/api/user_tokens/generate?name=github-actions-${GITHUB_RUN_ID}"
          curl -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=github-actions" -vvv
          TOKEN_RESPONSE=$(curl -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=github-actions-${GITHUB_RUN_ID}")
          TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.token')
          echo "SONAR_TOKEN=${TOKEN}"
          echo "PROJECT_KEY=${PROJECT_KEY}"

          /github/workspace/sonar/bin/sonar-scanner \
            -Dsonar.projectKey=${PROJECT_KEY} \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=${TOKEN} \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.python.xunit.reportPath=test-results.xml \
            -Dsonar.python.bandit.reportPaths=bandit-report.json \
            -Dsonar.exclusions=tests/**,venv/**,env/**,**/__pycache__/**
          sleep 30
          QUALITY_GATE=$(curl -u ${TOKEN}: "http://localhost:9000/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" | jq -r '.projectStatus.status')
        
          echo "Quality Gate Status: $QUALITY_GATE"       
          if [ "$QUALITY_GATE" != "OK" ]; then
            echo "Quality Gate failed!"
            echo "Ignoring errors for now, change next line to 'exit 1' to enforce quality gate."
            exit 0
          fi
  deploy:
    needs: [build, pre-build]
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    # if: ${{ vars.ENVIRONMENT_FROZEN == 'true'}} 
    steps:

      - name: Checkout shared workflows repo
        uses: actions/checkout@v3
        with:
          repository: Infocontrol-AR/shared-workflows
          ref: main
          path: shared-workflows
      
      # Copy scripts to a temporary location accessible via SSH
      - name: Prepare deployment scripts
        run: |
          cp shared-workflows/scripts/update-env.sh /tmp/update-env.sh
          cp ${{ inputs.DEPLOYMENT_SCRIPT_PATH }} /tmp/deployment.sh
          chmod +x /tmp/*.sh
      
      - name: Transfer deployment files to remote server
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no /tmp/update-env.sh neteng@${{ secrets.SSH_IP }}:/tmp/update-env.sh  
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no /tmp/deployment.sh neteng@${{ secrets.SSH_IP }}:/tmp/deployment.sh  
          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -o StrictHostKeyChecking=no .env.example neteng@${{ secrets.SSH_IP }}:/home/neteng/workspace/.env.example  

      - name: Deploy to remote server
        run: | 

          if [[ "${{ vars.ENVIRONMENT_FROZEN }}" == "true" ]]; then
            echo "Environment is frozen. Skipping deployment."
            exit 0
          fi
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -tt -o StrictHostKeyChecking=no neteng@${{ secrets.SSH_IP }} << 'EOF'

            echo "Running on remote machine..."
            echo "Releasing ${{ needs.pre-build.outputs.version }}"

            docker system prune -af
            
            docker login ${{ inputs.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            cd workspace

            if [ ! -d "${{ github.event.repository.name }}" ]; then
                echo "Folder does not exist, creating it..."
                mkdir ${{ github.event.repository.name }}
            fi    
            
            cd ${{ github.event.repository.name }}
            
            mv .env .env.bak || true
            mv .env.example .env

            chmod +x /tmp/update-env.sh
            /tmp/update-env.sh .env \
              QDRANT_URL "${{ secrets.QDRANT_URL }}" \
              QDRANT_API_KEY "${{ secrets.QDRANT_API_KEY }}" \
              EMBEDDING_MODEL "${{ secrets.EMBEDDING_MODEL }}" \
              AZURE_STORAGE_SAS_TOKEN "${{ secrets.AZURE_STORAGE_SAS_TOKEN }}" \
              AZURE_STORAGE_ACCOUNT_NAME "${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
              AZURE_STORAGE_CONTAINER_NAME "${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}" \
              UNSTRUCTURED_API_URL "${{ secrets.UNSTRUCTURED_API_URL }}" \
              UNSTRUCTURED_API_KEY "${{ secrets.UNSTRUCTURED_API_KEY }}" \
              LLAMAPARSE_API_KEY "${{ secrets.LLAMAPARSE_API_KEY }}" \
              FIREWORKS_API_KEY "${{ secrets.FIREWORKS_API_KEY }}" \
              FIREWORKS_MODEL "${{ secrets.FIREWORKS_MODEL }}" \
              FW_API_KEY "${{ secrets.FW_API_KEY }}" \
              FW_ENDPOINT "${{ secrets.FW_ENDPOINT }}" \
              FW_MODEL "${{ secrets.FW_MODEL }}" \
              DEBUG "${{ vars.DEBUG }}" \
              DOCKER_REGISTRY "${{ inputs.DOCKER_REGISTRY }}" \
              DOCKER_IMAGE_NAME "${{ inputs.DOCKER_IMAGE_NAME }}" \
              VERSION "${{ needs.pre-build.outputs.version }}"
            
            set -a
            source .env
            set +a
            export CONTAINER_NAME=${{ inputs.CONTAINER_NAME }}
            export CONTAINER_PORT=${{ inputs.CONTAINER_PORT }}

            /tmp/deployment.sh

            echo "All services started successfully!"
            echo "To view logs --> docker logs -f ${CONTAINER_NAME}"

            exit 0
          EOF
      - run: echo "Deployment completed successfully!"