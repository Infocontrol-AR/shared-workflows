name: Reusable Build and manage version

on:
  workflow_call:
    inputs:
      DOCKER_REGISTRY:
        description: 'DOCKER_REGISTRY'
        required: true
        type: string
      DOCKER_REGISTRY_SHORT:
        description: 'DOCKER_REGISTRY_SHORT'
        required: true
        type: string
      DOCKER_IMAGE_NAME:
        description: 'DOCKER_IMAGE_NAME'
        required: true
        type: string
      IMAGE_TAG:
        description: 'Override Docker image tag/version (if not set, version will be calculated automatically)'
        required: false
        type: string
        default: 'None'
      VERSION_NUMBER:
        description: 'Version number increment type (major, minor, or patch)'
        required: false
        type: string
        default: 'patch'
      SKIP_BUILD:
        description: 'Skip build stages and deploy existing version from app/_version.py'
        required: false
        type: boolean
        default: false
      DOCKERFILE_PATH:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      DOCKER_CONTEXT_PATH:
        description: 'Path to Docker build context'
        required: false
        type: string
        default: '.'
      CONTAINER_NAME:
        description: 'Name of the main container'
        required: true
        type: string
      CONTAINER_PORT:
        description: 'Port of the main container'
        required: true
        type: string
      DEPLOYMENT_SCRIPT_PATH:
        description: 'Path to deployment script'
        required: true
        type: string
      FROZEN_ENVIRONMENT:
        description: 'Whether to deploy after build'
        required: false
        type: string
        default: 'false'  

      REPOSITORY_NAME:
        description: 'Name of the repository which is being built'
        required: true
        type: string
      environment: 
        description: 'Deployment environment'
        required: true
        type: string
      enable_tests:
        description: 'Enable tests and quality checks'
        required: false
        type: boolean
        default: true
      health_check_endpoint:
        description: 'HTTP endpoint for health checks (e.g., /health)'
        required: false
        type: string
        default: '/health'
      health_check_timeout:
        description: 'Health check timeout in seconds'
        required: false
        type: number
        default: 300
      health_check_interval:
        description: 'Health check interval in seconds'
        required: false
        type: number
        default: 10

    secrets:

      SSH_PASSWORD:
        description: 'SSH_PASSWORD for deployment server'
        required: true
      SSH_IP:
        description: 'SSH_IP for deployment server'
        required: true 
      DOCKER_USERNAME:
        description: 'DOCKER_USERNAME'
        required: true
      DOCKER_PASSWORD:
        description: 'DOCKER_PASSWORD'
        required: true
      AZURE_STORAGE_ACCOUNT_NAME:
        description: 'AZURE_STORAGE_ACCOUNT_NAME'
        required: true
      AZURE_STORAGE_CONNECTION_STRING:
        description: 'AZURE_STORAGE_CONNECTION_STRING'
        required: true
      AZURE_STORAGE_CONTAINER_NAME:
        description: 'AZURE_STORAGE_CONTAINER_NAME'
        required: true
      AZURE_STORAGE_SAS_TOKEN:
        description: 'AZURE_STORAGE_SAS_TOKEN'
        required: true
      EMBEDDING_MODEL:
        description: 'EMBEDDING_MODEL'
        required: true
      FIREWORKS_API_KEY:
        description: 'FIREWORKS_API_KEY'
        required: true
      FIREWORKS_MODEL:
        description: 'FIREWORKS_MODEL'
        required: true
      FW_API_KEY:
        description: 'FW_API_KEY'
        required: true
      FW_ENDPOINT:
        description: 'FW_ENDPOINT'
        required: true
      FW_MODEL:
        description: 'FW_MODEL'
        required: true
      LLAMAPARSE_API_KEY:
        description: 'LLAMAPARSE_API_KEY'
        required: true
      QDRANT_API_KEY:
        description: 'QDRANT_API_KEY'
        required: true
      QDRANT_URL:
        description: 'QDRANT_URL'
        required: true
      UNSTRUCTURED_API_KEY:
        description: 'UNSTRUCTURED_API_KEY'
        required: true
      UNSTRUCTURED_API_URL:
        description: 'UNSTRUCTURED_API_URL'
        required: true
      KAFKA_SCHEMA_REGISTRY_URL:
        description: 'KAFKA_SCHEMA_REGISTRY_URL'
        required: false
      KAFKA_SCHEMA_REGISTRY_API_KEY: 
        description: 'KAFKA_SCHEMA_REGISTRY_API_KEY'
        required: false
      KAFKA_SCHEMA_REGISTRY_API_SECRET: 
        description: 'KAFKA_SCHEMA_REGISTRY_API_SECRET'
        required: false
      KAFKA_BOOTSTRAP:
        description: 'KAFKA_BOOTSTRAP'
        required: false
      KAFKA_SASL_PASSWORD:
        description: 'KAFKA_SASL_PASSWORD'
        required: false
      KAFKA_SASL_USERNAME:
        description: 'KAFKA_SASL_USERNAME'
        required: false
      JINA_API_KEY:
        description: 'JINA_API_KEY'
        required: false
      KAFKA_CLIENT_ID:
        description: 'KAFKA_CLIENT_ID'
        required: false
      KAFKA_TOPIC_PREFIX:
        description: 'KAFKA_TOPIC_PREFIX'
        required: false
      KAFKA_GROUP_ID:
        description: 'KAFKA_GROUP_ID'
        required: false
      KAFKA_KEY_SCHEMA_ID_AI_UPSERT:
        description: 'KAFKA_KEY_SCHEMA_ID_AI_UPSERT'
        required: false
      KAFKA_KEY_SCHEMA_ID_BATCH_UPDATE:
        description: 'KAFKA_KEY_SCHEMA_ID_BATCH_UPDATE'
        required: false
      KAFKA_KEY_SCHEMA_ID_DOCUMENT_UPDATE:
        description: 'KAFKA_KEY_SCHEMA_ID_DOCUMENT_UPDATE'
        required: false
      KAFKA_SCHEMA_ID_AI_UPSERT:
        description: 'KAFKA_SCHEMA_ID_AI_UPSERT'
        required: false
      KAFKA_SCHEMA_ID_BATCH_UPDATE:
        description: 'KAFKA_SCHEMA_ID_BATCH_UPDATE'
        required: false
      KAFKA_SCHEMA_ID_DOCUMENT_UPDATE:
        description: 'KAFKA_SCHEMA_ID_DOCUMENT_UPDATE'
        required: false
      MONGO_URI:
        description: 'MONGO_URI'
        required: false
      MONGO_DB:
        description: 'MONGO_DB'
        required: false
      MONGO_COLLECTION:
        description: 'MONGO_COLLECTION'
        required: false
      MONGO_RS_IP_1: 
        description: 'MONGO_RS_IP_1'
        required: false
      MONGO_RS_IP_2: 
        description: 'MONGO_RS_IP_2'
        required: false
      MONGO_RS_IP_3: 
        description: 'MONGO_RS_IP_3'
        required: false
      MONGO_RS_HOST_1: 
        description: 'MONGO_RS_HOST_1'
        required: false
      MONGO_RS_HOST_2: 
        description: 'MONGO_RS_HOST_2'
        required: false
      MONGO_RS_HOST_3: 
        description: 'MONGO_RS_HOST_3'
        required: false

jobs:

  get-version:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    if: ${{ inputs.SKIP_BUILD }}
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Read version
        id: read_version
        run: |
          # Find the most recently created tag matching vX.Y.Z pattern
          echo "Fetching all tags..."
          git fetch --tags --force
          
          # Get the most recent tag matching vX.Y.Z pattern (sorted by version)
          # This uses git's version sorting which correctly handles semantic versions
          LATEST_TAG=$(git tag --list "v[0-9]*.[0-9]*.[0-9]*" --sort=-version:refname | head -n 1)
          
          if [ -z "$LATEST_TAG" ]; then
            echo "No tags matching vX.Y.Z pattern found"
            exit 1
          else
            echo "Latest tag found: $LATEST_TAG"
            # Strip the 'v' prefix to get the version number
            VERSION="${LATEST_TAG}"
            echo "Extracted version: $VERSION"
          fi
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  pre-build:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    if: ${{ !inputs.SKIP_BUILD }}
    outputs:
      version: ${{ steps.compute_version.outputs.version }}
      previous_version: ${{ steps.get_previous_version.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
                
      - name: Compute version
        id: compute_version
        if: ${{ !inputs.SKIP_BUILD }}
        shell: bash
        run: |
          ref="${GITHUB_REF_NAME}"
          echo "Branch: $ref"

          # Check if IMAGE_TAG is set and not 'None'
          if [[ "${{ inputs.IMAGE_TAG }}" != "None" && -n "${{ inputs.IMAGE_TAG }}" ]]; then
            echo "Using provided IMAGE_TAG: ${{ inputs.IMAGE_TAG }}"
            echo "version=${{ inputs.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
            version=${{ inputs.IMAGE_TAG }}

            # Delete remote tag if it exists
            git push origin :refs/tags/$version || true
            # Delete local tag if it exists
            git tag -d $version || true
            # Recreate tag
            git tag -a "$version" -m "Tag $version created automatically"
            # Push tag
            git push origin "$version"
            exit 0
          fi

          case "$ref" in
            develop|develop_local|qa|staging|main)

              version="$ref-${{ github.run_id }}"
              echo "Calculated version: $version"

              # Tag does not exist → proceed normally
              git config user.email "devops@achilles.com"
              git config user.name "Achilles DevOps Bot"

              git tag -a "$version" -m "Tag $version created automatically"
              git add .

              git push --tags
              git push origin "$ref"

              echo "version=$version" >> "$GITHUB_OUTPUT"
              ;;
            *)
              version="latest-${{ github.run_id }}"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              ;;              
          esac

  build:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    needs: pre-build
    if: ${{ !inputs.SKIP_BUILD }}
    permissions:
      contents: read
      packages: write
      actions: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to custom Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.DOCKER_REGISTRY }} 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with dynamic tag
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.DOCKER_CONTEXT_PATH }} #/embedding-services/BAAI-bge-m3
          file: ${{ inputs.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:${{ needs.pre-build.outputs.version }}
            ${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:buildcache,mode=max
          
          
  deploy:
    needs: [build, pre-build, test-and-quality, get-version]
    if: |
      always() && 
      (
        (!inputs.SKIP_BUILD && needs.build.result == 'success' && (needs.test-and-quality.result == 'success' || needs.test-and-quality.result == 'skipped')) ||
        (inputs.SKIP_BUILD && needs.get-version.result == 'success')
      )
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      deployment_status: ${{ steps.deployment.outputs.status }}
      version: ${{ steps.set_version.outputs.version }}

    steps:
      - name: Set version for deployment
        id: set_version
        run: |
          if [[ "${{ inputs.SKIP_BUILD }}" == "true" ]]; then
            echo "version=${{ needs.get-version.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "Using version from get-version: ${{ needs.get-version.outputs.version }}"
          else
            echo "version=${{ needs.pre-build.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "Using version from build: ${{ needs.pre-build.outputs.version }}"
          fi

      - name: Checkout shared workflows repo
        uses: actions/checkout@v3
        with:
          repository: Infocontrol-AR/shared-workflows
          ref: develop
          path: shared-workflows

      - name: Check if environment is frozen
        id: check_frozen
        run: |
          if [[ "${{ vars.ENVIRONMENT_FROZEN }}" == "true" ]]; then
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Environment is frozen. Deployment will be skipped."
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi
           
      # Copy scripts to a temporary location accessible via SSH
      - name: Prepare deployment scripts
        if: steps.check_frozen.outputs.frozen != 'true'
        run: |
          mkdir -p /tmp/deployment-scripts
          cp shared-workflows/scripts/update-env.sh /tmp/deployment-scripts/
          cp shared-workflows/scripts/run-smoke-tests.sh /tmp/deployment-scripts/
          cp "${{ inputs.DEPLOYMENT_SCRIPT_PATH }}" /tmp/deployment-scripts/deployment.sh
          chmod +x /tmp/deployment-scripts/*.sh
      
      - name: Transfer deployment files
        if: steps.check_frozen.outputs.frozen != 'true'
        run: |
          set +H   # disables ! expansion
          sshpass -p '${{ secrets.SSH_PASSWORD }}' scp -o StrictHostKeyChecking=no \
            /tmp/deployment-scripts/update-env.sh \
            neteng@${{ secrets.SSH_IP }}:/tmp/update-env.sh
            
          sshpass -p '${{ secrets.SSH_PASSWORD }}' scp -o StrictHostKeyChecking=no \
            /tmp/deployment-scripts/run-smoke-tests.sh \
            neteng@${{ secrets.SSH_IP }}:/home/neteng/workspace/run-smoke-tests.sh
            
          sshpass -p '${{ secrets.SSH_PASSWORD }}' scp -o StrictHostKeyChecking=no \
            /tmp/deployment-scripts/deployment.sh \
            neteng@${{ secrets.SSH_IP }}:/tmp/deployment.sh
            
          sshpass -p '${{ secrets.SSH_PASSWORD }}' scp -o StrictHostKeyChecking=no \
            .env.example \
            neteng@${{ secrets.SSH_IP }}:/home/neteng/workspace/.env.example
            
          sshpass -p '${{ secrets.SSH_PASSWORD }}' scp -r -o StrictHostKeyChecking=no \
            shared-workflows/scripts/tests/smoke/ \
            neteng@${{ secrets.SSH_IP }}:/home/neteng/workspace/${{ github.event.repository.name }}/tests/

      - name: Deploy to server
        id: deployment
        if: steps.check_frozen.outputs.frozen != 'true'
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
        run: | 
          set +H   # disables ! expansion
          DEPLOYMENT_STATUS="failed"
          if [[ "${{ vars.ENVIRONMENT_FROZEN }}" == "true" ]]; then
            echo "Environment is frozen. Skipping deployment."
            exit 0
          fi
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -tt -o StrictHostKeyChecking=no neteng@${{ secrets.SSH_IP }} << 'EOF'

            # set -e
            
            echo "=== Deployment started ==="
            echo "Version: ${{ steps.set_version.outputs.version }}"
            echo "Repository: ${{ github.event.repository.name }}"
            
            docker buildx prune -af
            docker system prune -af
            
            docker login ${{ inputs.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            cd workspace

            if [ ! -d "${{ github.event.repository.name }}" ]; then
                echo "Folder does not exist, creating it..."
                mkdir ${{ github.event.repository.name }}
            fi    
            
            cd ${{ github.event.repository.name }}
            
            # Save current version for rollback
            if [ -f .deployed_version ]; then
              cp .deployed_version .deployed_version.backup
            fi
            echo "${{ steps.set_version.outputs.version }}" > .deployed_version
            
            # Backup existing .env
            if [ -f .env ]; then
              cp .env ".env.bak.$(date +%Y%m%d_%H%M%S)"
            fi

            # Copy new .env template
            cp ../.env.example .env

            chmod +x /tmp/update-env.sh
            cat .env
            /tmp/update-env.sh .env \
              QDRANT_URL "${{ secrets.QDRANT_URL }}" \
              QDRANT_API_KEY "${{ secrets.QDRANT_API_KEY }}" \
              EMBEDDING_MODEL "${{ secrets.EMBEDDING_MODEL }}" \
              AZURE_STORAGE_SAS_TOKEN "${{ secrets.AZURE_STORAGE_SAS_TOKEN }}" \
              AZURE_STORAGE_ACCOUNT_NAME "${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
              AZURE_STORAGE_CONTAINER_NAME "${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}" \
              UNSTRUCTURED_API_URL "${{ secrets.UNSTRUCTURED_API_URL }}" \
              UNSTRUCTURED_API_KEY "${{ secrets.UNSTRUCTURED_API_KEY }}" \
              LLAMAPARSE_API_KEY "${{ secrets.LLAMAPARSE_API_KEY }}" \
              FIREWORKS_API_KEY "${{ secrets.FIREWORKS_API_KEY }}" \
              FIREWORKS_MODEL "${{ secrets.FIREWORKS_MODEL }}" \
              FW_API_KEY "${{ secrets.FW_API_KEY }}" \
              FW_ENDPOINT "${{ secrets.FW_ENDPOINT }}" \
              FW_MODEL "${{ secrets.FW_MODEL }}" \
              DEBUG "${{ vars.DEBUG }}" \
              DOCKER_REGISTRY "${{ inputs.DOCKER_REGISTRY }}" \
              DOCKER_IMAGE_NAME "${{ inputs.DOCKER_IMAGE_NAME }}" \
              VERSION "${{ steps.set_version.outputs.version }}" \
              KAFKA_SCHEMA_REGISTRY_URL "${{ secrets.KAFKA_SCHEMA_REGISTRY_URL }}" \
              KAFKA_SCHEMA_REGISTRY_API_KEY "${{ secrets.KAFKA_SCHEMA_REGISTRY_API_KEY }}" \
              KAFKA_SCHEMA_REGISTRY_API_SECRET "${{ secrets.KAFKA_SCHEMA_REGISTRY_API_SECRET }}" \
              KAFKA_BOOTSTRAP "${{ secrets.KAFKA_BOOTSTRAP }}" \
              KAFKA_SASL_USERNAME "${{ secrets.KAFKA_SASL_USERNAME }}" \
              KAFKA_SASL_PASSWORD "${{ secrets.KAFKA_SASL_PASSWORD }}" \
              KAFKA_CLIENT_ID "${{ secrets.KAFKA_CLIENT_ID }}" \
              KAFKA_TOPIC_PREFIX "${{ secrets.KAFKA_TOPIC_PREFIX }}" \
              KAFKA_GROUP_ID "${{ secrets.KAFKA_GROUP_ID }}" \
              JINA_API_KEY "${{ secrets.JINA_API_KEY }}" \
              KAFKA_KEY_SCHEMA_ID_AI_UPSERT "${{ secrets.KAFKA_KEY_SCHEMA_ID_AI_UPSERT }}" \
              KAFKA_KEY_SCHEMA_ID_BATCH_UPDATE "${{ secrets.KAFKA_KEY_SCHEMA_ID_BATCH_UPDATE }}" \
              KAFKA_KEY_SCHEMA_ID_DOCUMENT_UPDATE "${{ secrets.KAFKA_KEY_SCHEMA_ID_DOCUMENT_UPDATE }}" \
              KAFKA_SCHEMA_ID_AI_UPSERT "${{ secrets.KAFKA_SCHEMA_ID_AI_UPSERT }}" \
              KAFKA_SCHEMA_ID_BATCH_UPDATE "${{ secrets.KAFKA_SCHEMA_ID_BATCH_UPDATE }}" \
              KAFKA_SCHEMA_ID_DOCUMENT_UPDATE "${{ secrets.KAFKA_SCHEMA_ID_DOCUMENT_UPDATE }}" \
              MONGO_URI "${{ secrets.MONGO_URI }}" \
              MONGO_DB "${{ secrets.MONGO_DB }}" \
              MONGO_COLLECTION "${{ secrets.MONGO_COLLECTION }}" \
              MONGO_RS_IP_1 "${{ secrets.MONGO_RS_IP_1 }}" \
              MONGO_RS_IP_2 "${{ secrets.MONGO_RS_IP_2 }}" \
              MONGO_RS_IP_3 "${{ secrets.MONGO_RS_IP_3 }}" \
              MONGO_RS_HOST_1 "${{ secrets.MONGO_RS_HOST_1 }}" \
              MONGO_RS_HOST_2 "${{ secrets.MONGO_RS_HOST_2 }}" \
              MONGO_RS_HOST_3 "${{ secrets.MONGO_RS_HOST_3 }}"

            set -a
            source .env
            set +a
            export CONTAINER_NAME=${{ inputs.CONTAINER_NAME }}
            export CONTAINER_PORT=${{ inputs.CONTAINER_PORT }}
            export DOCKER_REGISTRY=${{ inputs.DOCKER_REGISTRY }}
            export DOCKER_IMAGE_NAME=${{ inputs.DOCKER_IMAGE_NAME }}
            export VERSION=${{ steps.set_version.outputs.version }}
            export NETWORK_NAME="achilles-middleware-network"
            export SSH_IP=${{ secrets.SSH_IP }}

            # Run deployment script
            echo "Running deployment script..."
            /tmp/deployment.sh
            echo "=== Deployment completed successfully ==="
            echo "Container: ${CONTAINER_NAME}"

            echo "All services started successfully!"

            echo "To view logs --> docker logs -f ${CONTAINER_NAME}"
            # echo "Running smoke tests..."
            # /home/neteng/workspace/run-smoke-tests.sh ${{ github.event.repository.name }}
            exit 0
          EOF

          # Capture the exit code of the previous command immediately
          rc=$?
          echo "Exit code so far: $rc"

          # Determine deployment status from the exit code
          if [ "$rc" -eq 0 ]; then
            DEPLOYMENT_STATUS="success"
          else
            DEPLOYMENT_STATUS="failed"
          fi

          echo "status=$DEPLOYMENT_STATUS" >> "$GITHUB_OUTPUT"
          
          if [ "$DEPLOYMENT_STATUS" = "failed" ]; then
            echo "::error::Deployment failed"
            exit 1
          fi
          exit 0
