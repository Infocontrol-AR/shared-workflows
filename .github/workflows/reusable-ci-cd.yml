name: Reusable Build and manage version

on:
  workflow_call:
    inputs:
      DOCKER_REGISTRY:
        description: 'DOCKER_REGISTRY'
        required: true
        type: string
      DOCKER_REGISTRY_SHORT:
        description: 'DOCKER_REGISTRY_SHORT'
        required: true
        type: string
      DOCKER_IMAGE_NAME:
        description: 'DOCKER_IMAGE_NAME'
        required: true
        type: string
      IMAGE_TAG:
        description: 'Override Docker image tag/version (if not set, version will be calculated automatically)'
        required: false
        type: string
        default: 'None'
      VERSION_NUMBER:
        description: 'Version number increment type (major, minor, or patch)'
        required: false
        type: string
        default: 'patch'
      SKIP_BUILD:
        description: 'Skip build stages and deploy existing version from app/_version.py'
        required: false
        type: boolean
        default: false
      DOCKERFILE_PATH:
        description: 'Path to Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      DOCKER_CONTEXT_PATH:
        description: 'Path to Docker build context'
        required: false
        type: string
        default: '.'
      CONTAINER_NAME:
        description: 'Name of the main container'
        required: true
        type: string
      CONTAINER_PORT:
        description: 'Port of the main container'
        required: true
        type: string
      DEPLOYMENT_SCRIPT_PATH:
        description: 'Path to deployment script'
        required: true
        type: string
      FROZEN_ENVIRONMENT:
        description: 'Whether to deploy after build'
        required: false
        type: string
        default: 'false'  
      VERSION_FILE_NAME:
        description: 'File name with the version of the application'
        required: true
        type: string
      REPOSITORY_NAME:
        description: 'Name of the repository which is being built'
        required: true
        type: string
      environment: 
        description: 'Deployment environment'
        required: true
        type: string
      enable_tests:
        description: 'Enable tests and quality checks'
        required: false
        type: boolean
        default: true
      health_check_endpoint:
        description: 'HTTP endpoint for health checks (e.g., /health)'
        required: false
        type: string
        default: '/health'
      health_check_timeout:
        description: 'Health check timeout in seconds'
        required: false
        type: number
        default: 300
      health_check_interval:
        description: 'Health check interval in seconds'
        required: false
        type: number
        default: 10

    secrets:

      SSH_PASSWORD:
        description: 'SSH_PASSWORD for deployment server'
        required: true
      SSH_IP:
        description: 'SSH_IP for deployment server'
        required: true 
      DOCKER_USERNAME:
        description: 'DOCKER_USERNAME'
        required: true
      DOCKER_PASSWORD:
        description: 'DOCKER_PASSWORD'
        required: true
      AZURE_STORAGE_ACCOUNT_NAME:
        description: 'AZURE_STORAGE_ACCOUNT_NAME'
        required: true
      AZURE_STORAGE_CONNECTION_STRING:
        description: 'AZURE_STORAGE_CONNECTION_STRING'
        required: true
      AZURE_STORAGE_CONTAINER_NAME:
        description: 'AZURE_STORAGE_CONTAINER_NAME'
        required: true
      AZURE_STORAGE_SAS_TOKEN:
        description: 'AZURE_STORAGE_SAS_TOKEN'
        required: true
      EMBEDDING_MODEL:
        description: 'EMBEDDING_MODEL'
        required: true
      FIREWORKS_API_KEY:
        description: 'FIREWORKS_API_KEY'
        required: true
      FIREWORKS_MODEL:
        description: 'FIREWORKS_MODEL'
        required: true
      FW_API_KEY:
        description: 'FW_API_KEY'
        required: true
      FW_ENDPOINT:
        description: 'FW_ENDPOINT'
        required: true
      FW_MODEL:
        description: 'FW_MODEL'
        required: true
      LLAMAPARSE_API_KEY:
        description: 'LLAMAPARSE_API_KEY'
        required: true
      QDRANT_API_KEY:
        description: 'QDRANT_API_KEY'
        required: true
      QDRANT_URL:
        description: 'QDRANT_URL'
        required: true
      UNSTRUCTURED_API_KEY:
        description: 'UNSTRUCTURED_API_KEY'
        required: true
      UNSTRUCTURED_API_URL:
        description: 'UNSTRUCTURED_API_URL'
        required: true
      KAFKA_SCHEMA_REGISTRY_URL:
        description: 'KAFKA_SCHEMA_REGISTRY_URL'
        required: false
      KAFKA_SCHEMA_REGISTRY_API_KEY: 
        description: 'KAFKA_SCHEMA_REGISTRY_API_KEY'
        required: false
      KAFKA_SCHEMA_REGISTRY_API_SECRET: 
        description: 'KAFKA_SCHEMA_REGISTRY_API_SECRET'
        required: false
      KAFKA_BOOTSTRAP:
        description: 'KAFKA_BOOTSTRAP'
        required: false
      KAFKA_SASL_PASSWORD:
        description: 'KAFKA_SASL_PASSWORD'
        required: false
      KAFKA_SASL_USERNAME:
        description: 'KAFKA_SASL_USERNAME'
        required: false
      JINA_API_KEY:
        description: 'JINA_API_KEY'
        required: false
      KAFKA_CLIENT_ID:
        description: 'KAFKA_CLIENT_ID'
        required: false
      KAFKA_TOPIC_PREFIX:
        description: 'KAFKA_TOPIC_PREFIX'
        required: false
      KAFKA_GROUP_ID:
        description: 'KAFKA_GROUP_ID'
        required: false
      KAFKA_KEY_SCHEMA_ID_AI_UPSERT:
        description: 'KAFKA_KEY_SCHEMA_ID_AI_UPSERT'
        required: false
      KAFKA_KEY_SCHEMA_ID_BATCH_UPDATE:
        description: 'KAFKA_KEY_SCHEMA_ID_BATCH_UPDATE'
        required: false
      KAFKA_KEY_SCHEMA_ID_DOCUMENT_UPDATE:
        description: 'KAFKA_KEY_SCHEMA_ID_DOCUMENT_UPDATE'
        required: false
      KAFKA_SCHEMA_ID_AI_UPSERT:
        description: 'KAFKA_SCHEMA_ID_AI_UPSERT'
        required: false
      KAFKA_SCHEMA_ID_BATCH_UPDATE:
        description: 'KAFKA_SCHEMA_ID_BATCH_UPDATE'
        required: false
      KAFKA_SCHEMA_ID_DOCUMENT_UPDATE:
        description: 'KAFKA_SCHEMA_ID_DOCUMENT_UPDATE'
        required: false

jobs:

  get-version:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    if: ${{ inputs.SKIP_BUILD }}
    outputs:
      version: ${{ steps.read_version.outputs.version }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Read version from app/_version.py
        id: read_version
        run: |
          if [ -f "app/_version.py" ]; then
            # Extract version from _version.py
            # Assuming format like: __version__ = "1.2.3" or __version__ = '1.2.3'
            VERSION=$(grep -oP '__version__\s*=\s*["\047]\K[^"\047]+' app/_version.py || echo "")
            
            if [ -z "$VERSION" ]; then
              echo "::error::Could not extract version from app/_version.py"
              exit 1
            fi
            
            echo "Extracted version: $VERSION"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "::error::app/_version.py not found"
            exit 1
          fi

  pre-build:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    outputs:
      version: ${{ steps.compute_version.outputs.version }}
      previous_version: ${{ steps.get_previous_version.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}
      
      - name: Validate commits and branch naming
        id: validate_commits
        run: |
          echo "=== Running commit and branch validation ==="
          
          ref="${GITHUB_REF_NAME}"
          echo "Branch: $ref"
          
          # Check if commits are GPG signed
          echo "Checking GPG signatures..."
          UNSIGNED_COMMITS=$(git log --show-signature -1 2>&1 | grep -c "No signature" || true)
          
          if [ "$UNSIGNED_COMMITS" -gt 0 ]; then
            echo "::warning::Latest commit is not GPG signed. Consider signing your commits for better security."
          else
            echo "✅ Latest commit is GPG signed"
          fi
          
          # Extract ticket number from branch name if it matches the pattern
          TICKET_NUMBER=""
          if [[ "$ref" =~ ^(feature|issue|fix|hotfix|bugfix)/([0-9]{3}) ]]; then
            TICKET_NUMBER="${BASH_REMATCH[2]}"
            echo "Detected ticket number: $TICKET_NUMBER"
            
            # Get the last commit message
            COMMIT_MSG=$(git log -1 --pretty=%B)
            echo "Current commit message: $COMMIT_MSG"
            
            # Check if commit message starts with "XXX:"
            if [[ ! "$COMMIT_MSG" =~ ^${TICKET_NUMBER}: ]]; then
              echo "Commit message does not start with '${TICKET_NUMBER}:'. Amending commit..."
              
              # Amend the commit message
              NEW_COMMIT_MSG="${TICKET_NUMBER}: ${COMMIT_MSG}"
              
              git config user.email "devops@achilles.com"
              git config user.name "Achilles DevOps Bot"
              
              git commit --amend -m "$NEW_COMMIT_MSG"
              
              # Force push the amended commit
              git push --force-with-lease origin "$ref"
              
              echo "✅ Commit message amended to: $NEW_COMMIT_MSG"
            else
              echo "✅ Commit message already starts with '${TICKET_NUMBER}:'"
            fi
          elif [[ "$ref" =~ ^(develop|main|qa|staging)$ ]]; then
            echo "✅ Branch '$ref' is a standard branch, skipping ticket number validation"
          else
            echo "::warning::Branch name '$ref' does not follow the expected pattern (feature/XXX, issue/XXX, fix/XXX, hotfix/XXX, bugfix/XXX where XXX is a 3-digit number). Consider following the naming convention."
          fi
          
          echo "=== Validation complete ==="
      
      - name: Get previous version
        id: get_previous_version
        if: ${{ !inputs.SKIP_BUILD }}
        run: |
          
          # Get the current deployed version for rollback purposes
          set +H   # disables ! expansion
          PREV_VERSION=$(sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            neteng@${{ secrets.SSH_IP }} \
            "cat /home/neteng/workspace/${{ github.event.repository.name }}/.deployed_version 2>/dev/null || echo 'none'")
          echo "version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
          echo "Previous deployed version: $PREV_VERSION"
          
      - name: Compute version
        id: compute_version
        if: ${{ !inputs.SKIP_BUILD }}
        shell: bash
        run: |
          # Check if IMAGE_TAG is set and not 'None'
          if [[ "${{ inputs.IMAGE_TAG }}" != "None" && -n "${{ inputs.IMAGE_TAG }}" ]]; then
            echo "Using provided IMAGE_TAG: ${{ inputs.IMAGE_TAG }}"
            echo "version=${{ inputs.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Otherwise, calculate version as before
          if [[ "${{ inputs.VERSION_FILE_NAME }}" == "None" ]]; then
            echo "Using hardcoded version."
            echo "version=bge-m3" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          ref="${GITHUB_REF_NAME}"
          echo "Branch: $ref"
          
          case "$ref" in
            develop|main|feature/*|issue/*|fix/*)
              version="latest-${{ github.run_id }}"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              ;;
            qa|staging|bugfix/*)
              python3 /devops-tools/versionmanager.py increase "${{ inputs.VERSION_FILE_NAME }}" --number "${{ inputs.VERSION_NUMBER }}"
              version=$(python3 /devops-tools/versionmanager.py get "${{ inputs.VERSION_FILE_NAME }}")
              version=$(echo "$version" | tr -d '\r' | xargs)
              
              git config user.email "devops@achilles.com"
              git config user.name "Achilles DevOps Bot"
              
              git tag -a "$version" -m "Tag $version created automatically"
              git add .
              git commit -m "NOTICKET: Increasing version number" || echo "No changes to commit"
              
              git push --tags
              git push origin "$ref"
              
              echo "version=$version" >> "$GITHUB_OUTPUT"
              ;;
            hotfix/*)
              python3 /devops-tools/versionmanager.py increase "${{ inputs.VERSION_FILE_NAME }}" --number "patch"
              version=$(python3 /devops-tools/versionmanager.py get "${{ inputs.VERSION_FILE_NAME }}")
              version=$(echo "$version" | tr -d '\r' | xargs)
              
              git config user.email "devops@achilles.com"
              git config user.name "Achilles DevOps Bot"
              
              git tag -a "$version" -m "Tag $version created automatically"
              git add .
              git commit -m "NOTICKET: Increasing version number" || echo "No changes to commit"
              
              git push --tags
              git push origin "$ref"
              
              echo "version=$version" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=unknown" >> "$GITHUB_OUTPUT"
              echo "::warning::Unknown branch '$ref', version set to 'unknown'"
              ;;
          esac

  build:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    needs: pre-build
    if: ${{ !inputs.SKIP_BUILD }}
    permissions:
      contents: read
      packages: write
      actions: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to custom Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.DOCKER_REGISTRY }} 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image with dynamic tag
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.DOCKER_CONTEXT_PATH }} #/embedding-services/BAAI-bge-m3
          file: ${{ inputs.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:${{ needs.pre-build.outputs.version }}
            ${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:buildcache,mode=max
          
      - name: Run Trivy security scan
        if: ${{ inputs.enable_tests }}
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'image'
          image-ref: '${{ inputs.DOCKER_REGISTRY }}/${{ inputs.DOCKER_IMAGE_NAME }}:${{ needs.pre-build.outputs.version }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
      - name: Upload Trivy report as artifact
        if: ${{ inputs.enable_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ needs.pre-build.outputs.version }}
          path: trivy-results.sarif          

  test-and-quality:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    needs: pre-build
    if: ${{ inputs.enable_tests && !inputs.SKIP_BUILD }}
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest coverage bandit

      - name: Run tests with coverage
        run: |
          if [ -d tests ]; then
            pytest tests/test_examples.py --junitxml=test-results.xml || true
            coverage run -m pytest tests/test_examples.py || true
            coverage xml -o coverage.xml || true
            coverage report || true
          else
            echo "No tests directory found, skipping tests"
            exit 0
          fi
          exit 0
      - name: Run security scan with Bandit
        run: |
          bandit -r . -f json -o bandit-report.json -ll || true
          
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ needs.pre-build.outputs.version }}
          path: |
            test-results.xml
            coverage.xml
            bandit-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Set up SonarQube project
        continue-on-error: true
        if: ${{ inputs.environment == 'development' }} 
        run: |
          # Create project and get token
          PROJECT_KEY="${{ github.event.repository.name }}"
          # Create project (using default admin credentials)
          curl -u admin:admin -X POST "http://localhost:9000/api/projects/create?project=${PROJECT_KEY}&name=${PROJECT_KEY}"
          echo "http://localhost:9000/api/projects/create?project=${PROJECT_KEY}&name=${PROJECT_KEY}"

          # Generate user token for analysis
          echo  "http://localhost:9000/api/user_tokens/generate?name=github-actions-${GITHUB_RUN_ID}"
          curl -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=github-actions" -vvv
          TOKEN_RESPONSE=$(curl -u admin:admin -X POST "http://localhost:9000/api/user_tokens/generate?name=github-actions-${GITHUB_RUN_ID}")
          TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.token')
          echo "SONAR_TOKEN=${TOKEN}"
          echo "PROJECT_KEY=${PROJECT_KEY}"

          /github/workspace/sonar/bin/sonar-scanner \
            -Dsonar.projectKey=${PROJECT_KEY} \
            -Dsonar.sources=. \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=${TOKEN} \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.python.xunit.reportPath=test-results.xml \
            -Dsonar.python.bandit.reportPaths=bandit-report.json \
            -Dsonar.exclusions=tests/**,venv/**,env/**,**/__pycache__/**
          sleep 30
          QUALITY_GATE=$(curl -u ${TOKEN}: "http://localhost:9000/api/qualitygates/project_status?projectKey=${PROJECT_KEY}" | jq -r '.projectStatus.status')
        
          echo "Quality Gate Status: $QUALITY_GATE"       
          if [ "$QUALITY_GATE" != "OK" ]; then
            echo "Quality Gate failed!"
            echo "Ignoring errors for now, change next line to 'exit 1' to enforce quality gate."
            exit 0
          fi
  deploy:
    needs: [build, pre-build, test-and-quality, get-version]
    if: |
      always() && 
      (
        (!inputs.SKIP_BUILD && needs.build.result == 'success' && (needs.test-and-quality.result == 'success' || needs.test-and-quality.result == 'skipped')) ||
        (inputs.SKIP_BUILD && needs.get-version.result == 'success')
      )
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    outputs:
      deployment_status: ${{ steps.deployment.outputs.status }}
      version: ${{ steps.set_version.outputs.version }}

    steps:
      - name: Set version for deployment
        id: set_version
        run: |
          if [[ "${{ inputs.SKIP_BUILD }}" == "true" ]]; then
            echo "version=${{ needs.get-version.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "Using version from app/_version.py: ${{ needs.get-version.outputs.version }}"
          else
            echo "version=${{ needs.pre-build.outputs.version }}" >> "$GITHUB_OUTPUT"
            echo "Using version from build: ${{ needs.pre-build.outputs.version }}"
          fi

      - name: Checkout shared workflows repo
        uses: actions/checkout@v3
        with:
          repository: Infocontrol-AR/shared-workflows
          ref: develop
          path: shared-workflows

      - name: Check if environment is frozen
        id: check_frozen
        run: |
          if [[ "${{ vars.ENVIRONMENT_FROZEN }}" == "true" ]]; then
            echo "frozen=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Environment is frozen. Deployment will be skipped."
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi
           
      # Copy scripts to a temporary location accessible via SSH
      - name: Prepare deployment scripts
        if: steps.check_frozen.outputs.frozen != 'true'
        run: |
          mkdir -p /tmp/deployment-scripts
          cp shared-workflows/scripts/update-env.sh /tmp/deployment-scripts/
          cp shared-workflows/scripts/run-smoke-tests.sh /tmp/deployment-scripts/
          cp "${{ inputs.DEPLOYMENT_SCRIPT_PATH }}" /tmp/deployment-scripts/deployment.sh
          chmod +x /tmp/deployment-scripts/*.sh
      
      - name: Transfer deployment files
        if: steps.check_frozen.outputs.frozen != 'true'
        run: |
          set +H   # disables ! expansion
          sshpass -p '${{ secrets.SSH_PASSWORD }}' scp -o StrictHostKeyChecking=no \
            /tmp/deployment-scripts/update-env.sh \
            neteng@${{ secrets.SSH_IP }}:/tmp/update-env.sh
            
          sshpass -p '${{ secrets.SSH_PASSWORD }}' scp -o StrictHostKeyChecking=no \
            /tmp/deployment-scripts/run-smoke-tests.sh \
            neteng@${{ secrets.SSH_IP }}:/home/neteng/workspace/run-smoke-tests.sh
            
          sshpass -p '${{ secrets.SSH_PASSWORD }}' scp -o StrictHostKeyChecking=no \
            /tmp/deployment-scripts/deployment.sh \
            neteng@${{ secrets.SSH_IP }}:/tmp/deployment.sh
            
          sshpass -p '${{ secrets.SSH_PASSWORD }}' scp -o StrictHostKeyChecking=no \
            .env.example \
            neteng@${{ secrets.SSH_IP }}:/home/neteng/workspace/.env.example
            
          sshpass -p '${{ secrets.SSH_PASSWORD }}' scp -r -o StrictHostKeyChecking=no \
            shared-workflows/scripts/tests/smoke/ \
            neteng@${{ secrets.SSH_IP }}:/home/neteng/workspace/${{ github.event.repository.name }}/tests/

      - name: Deploy to server
        id: deployment
        if: steps.check_frozen.outputs.frozen != 'true'
        env:
          VERSION: ${{ steps.set_version.outputs.version }}
        run: | 
          set +H   # disables ! expansion
          DEPLOYMENT_STATUS="failed"
          if [[ "${{ vars.ENVIRONMENT_FROZEN }}" == "true" ]]; then
            echo "Environment is frozen. Skipping deployment."
            exit 0
          fi
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -tt -o StrictHostKeyChecking=no neteng@${{ secrets.SSH_IP }} << 'EOF'

            # set -e
            
            echo "=== Deployment started ==="
            echo "Version: ${{ steps.set_version.outputs.version }}"
            echo "Repository: ${{ github.event.repository.name }}"
            
            docker buildx prune -af
            docker system prune -af
            
            docker login ${{ inputs.DOCKER_REGISTRY }} -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            cd workspace

            if [ ! -d "${{ github.event.repository.name }}" ]; then
                echo "Folder does not exist, creating it..."
                mkdir ${{ github.event.repository.name }}
            fi    
            
            cd ${{ github.event.repository.name }}
            
            # Save current version for rollback
            if [ -f .deployed_version ]; then
              cp .deployed_version .deployed_version.backup
            fi
            echo "${{ steps.set_version.outputs.version }}" > .deployed_version
            
            # Backup existing .env
            if [ -f .env ]; then
              cp .env ".env.bak.$(date +%Y%m%d_%H%M%S)"
            fi

            # Copy new .env template
            cp ../.env.example .env

            chmod +x /tmp/update-env.sh
            cat .env
            /tmp/update-env.sh .env \
              QDRANT_URL "${{ secrets.QDRANT_URL }}" \
              QDRANT_API_KEY "${{ secrets.QDRANT_API_KEY }}" \
              EMBEDDING_MODEL "${{ secrets.EMBEDDING_MODEL }}" \
              AZURE_STORAGE_SAS_TOKEN "${{ secrets.AZURE_STORAGE_SAS_TOKEN }}" \
              AZURE_STORAGE_ACCOUNT_NAME "${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}" \
              AZURE_STORAGE_CONTAINER_NAME "${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}" \
              UNSTRUCTURED_API_URL "${{ secrets.UNSTRUCTURED_API_URL }}" \
              UNSTRUCTURED_API_KEY "${{ secrets.UNSTRUCTURED_API_KEY }}" \
              LLAMAPARSE_API_KEY "${{ secrets.LLAMAPARSE_API_KEY }}" \
              FIREWORKS_API_KEY "${{ secrets.FIREWORKS_API_KEY }}" \
              FIREWORKS_MODEL "${{ secrets.FIREWORKS_MODEL }}" \
              FW_API_KEY "${{ secrets.FW_API_KEY }}" \
              FW_ENDPOINT "${{ secrets.FW_ENDPOINT }}" \
              FW_MODEL "${{ secrets.FW_MODEL }}" \
              DEBUG "${{ vars.DEBUG }}" \
              DOCKER_REGISTRY "${{ inputs.DOCKER_REGISTRY }}" \
              DOCKER_IMAGE_NAME "${{ inputs.DOCKER_IMAGE_NAME }}" \
              VERSION "${{ steps.set_version.outputs.version }}" \
              KAFKA_SCHEMA_REGISTRY_URL "${{ secrets.KAFKA_SCHEMA_REGISTRY_URL }}" \
              KAFKA_SCHEMA_REGISTRY_API_KEY "${{ secrets.KAFKA_SCHEMA_REGISTRY_API_KEY }}" \
              KAFKA_SCHEMA_REGISTRY_API_SECRET "${{ secrets.KAFKA_SCHEMA_REGISTRY_API_SECRET }}" \
              KAFKA_BOOTSTRAP "${{ secrets.KAFKA_BOOTSTRAP }}" \
              KAFKA_SASL_USERNAME "${{ secrets.KAFKA_SASL_USERNAME }}" \
              KAFKA_SASL_PASSWORD "${{ secrets.KAFKA_SASL_PASSWORD }}" \
              KAFKA_CLIENT_ID "${{ secrets.KAFKA_CLIENT_ID }}" \
              KAFKA_TOPIC_PREFIX "${{ secrets.KAFKA_TOPIC_PREFIX }}" \
              KAFKA_GROUP_ID "${{ secrets.KAFKA_GROUP_ID }}" \
              JINA_API_KEY "${{ secrets.JINA_API_KEY }}" \
              KAFKA_KEY_SCHEMA_ID_AI_UPSERT "${{ secrets.KAFKA_KEY_SCHEMA_ID_AI_UPSERT }}" \
              KAFKA_KEY_SCHEMA_ID_BATCH_UPDATE "${{ secrets.KAFKA_KEY_SCHEMA_ID_BATCH_UPDATE }}" \
              KAFKA_KEY_SCHEMA_ID_DOCUMENT_UPDATE "${{ secrets.KAFKA_KEY_SCHEMA_ID_DOCUMENT_UPDATE }}" \
              KAFKA_SCHEMA_ID_AI_UPSERT "${{ secrets.KAFKA_SCHEMA_ID_AI_UPSERT }}" \
              KAFKA_SCHEMA_ID_BATCH_UPDATE "${{ secrets.KAFKA_SCHEMA_ID_BATCH_UPDATE }}" \
              KAFKA_SCHEMA_ID_DOCUMENT_UPDATE "${{ secrets.KAFKA_SCHEMA_ID_DOCUMENT_UPDATE }}"
            set -a
            source .env
            set +a
            export CONTAINER_NAME=${{ inputs.CONTAINER_NAME }}
            export CONTAINER_PORT=${{ inputs.CONTAINER_PORT }}
            export DOCKER_REGISTRY=${{ inputs.DOCKER_REGISTRY }}
            export DOCKER_IMAGE_NAME=${{ inputs.DOCKER_IMAGE_NAME }}
            export VERSION=${{ steps.set_version.outputs.version }}
            export NETWORK_NAME="achilles-middleware-network"
            export SSH_IP=${{ secrets.SSH_IP }}

            # Run deployment script
            echo "Running deployment script..."
            /tmp/deployment.sh
            echo "=== Deployment completed successfully ==="
            echo "Container: ${CONTAINER_NAME}"

            echo "All services started successfully!"

            echo "To view logs --> docker logs -f ${CONTAINER_NAME}"
            # echo "Running smoke tests..."
            # /home/neteng/workspace/run-smoke-tests.sh ${{ github.event.repository.name }}
            exit 0
          EOF

          # Capture the exit code of the previous command immediately
          rc=$?
          echo "Exit code so far: $rc"

          # Determine deployment status from the exit code
          if [ "$rc" -eq 0 ]; then
            DEPLOYMENT_STATUS="success"
          else
            DEPLOYMENT_STATUS="failed"
          fi

          echo "status=$DEPLOYMENT_STATUS" >> "$GITHUB_OUTPUT"
          
          if [ "$DEPLOYMENT_STATUS" = "failed" ]; then
            echo "::error::Deployment failed"
            exit 1
          fi
          exit 0

  health-check:
    needs: [deploy]
    if: |
      always() &&
      needs.deploy.result == 'success' &&
      needs.deploy.outputs.deployment_status == 'success'
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    outputs:
      health_status: ${{ steps.health_check.outputs.status }}
      
    steps:
      - name: Wait for container startup
        run: |
          echo "Waiting 30 seconds for container to start..."
          sleep 30
          
      - name: Run health checks
        id: health_check
        run: |
          HEALTH_STATUS="unhealthy"
          TIMEOUT=${{ inputs.health_check_timeout }}
          INTERVAL=${{ inputs.health_check_interval }}
          ELAPSED=0
          
          echo "Starting health checks..."
          echo "Endpoint: http://${{ secrets.SSH_IP }}:${{ inputs.CONTAINER_PORT }}${{ inputs.health_check_endpoint }}"
          echo "Timeout: ${TIMEOUT}s, Interval: ${INTERVAL}s"
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --max-time 5 \
              "http://${{ secrets.SSH_IP }}:${{ inputs.CONTAINER_PORT }}${{ inputs.health_check_endpoint }}" || echo "000")
            
            echo "Attempt $(($ELAPSED / $INTERVAL + 1)): HTTP $HTTP_CODE"
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Health check passed!"
              HEALTH_STATUS="healthy"
              break
            fi
            
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          
          if [ "$HEALTH_STATUS" = "unhealthy" ]; then
            echo "::error::Health checks failed after ${TIMEOUT}s"
          fi
          
          echo "status=$HEALTH_STATUS" >> "$GITHUB_OUTPUT"
      
      - name: Run smoke tests
        if: steps.health_check.outputs.status == 'healthy'
        run: |
          set +H   # disables ! expansion
          echo "Running smoke tests..."
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -tt -o StrictHostKeyChecking=no neteng@${{ secrets.SSH_IP }} << 'EOF'
            cd workspace
            cd ${{ github.event.repository.name }}
            /home/neteng/workspace/run-smoke-tests.sh '${{ github.event.repository.name }}'
            exit 0
          EOF
      
      - name: Collect container logs
        if: always()
        run: |
          set +H   # disables ! expansion
          echo "Collecting container logs..."
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            neteng@${{ secrets.SSH_IP }} \
            "docker logs --tail 100 ${{ inputs.CONTAINER_NAME }}" > container-logs.txt || true
            
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-logs-${{ needs.deploy.outputs.version }}
          path: container-logs.txt
          retention-days: 7

  rollback:
    needs: [health-check, pre-build, deploy, get-version]
    if: |
      always() &&
      inputs.rollback_enabled == true &&
      (needs.deploy.result == 'failure' || needs.health-check.outputs.health_status == 'unhealthy') &&
      (
        (!inputs.SKIP_BUILD && needs.pre-build.outputs.previous_version != 'none') ||
        inputs.SKIP_BUILD
      )
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    
    steps:
      - name: Get previous version for rollback
        id: get_rollback_version
        run: |
          set +H   # disables ! expansion
          if [[ "${{ inputs.SKIP_BUILD }}" == "true" ]]; then
            # When skipping build, get the currently deployed version from the server
            PREV_VERSION=$(sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no \
              neteng@${{ secrets.SSH_IP }} \
              "cat /home/neteng/workspace/${{ github.event.repository.name }}/.deployed_version.backup 2>/dev/null || echo 'none'")
          else
            PREV_VERSION="${{ needs.pre-build.outputs.previous_version }}"
          fi
          
          echo "rollback_version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
          echo "Rollback version: $PREV_VERSION"
          
          if [[ "$PREV_VERSION" == "none" ]]; then
            echo "::error::No previous version available for rollback"
            exit 1
          fi
          
      - name: Rollback to previous version
        run: |
          set +H   # disables ! expansion
          echo "🔄 Initiating rollback to version: ${{ steps.get_rollback_version.outputs.rollback_version }}"
          
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -tt -o StrictHostKeyChecking=no \
            neteng@${{ secrets.SSH_IP }} << 'ENDSSH'
            
          set -e
          
          echo "=== Rollback started ==="
          
          cd /home/neteng/workspace/${{ github.event.repository.name }}
          
          # Stop current container
          docker stop ${{ inputs.CONTAINER_NAME }} || true
          docker rm ${{ inputs.CONTAINER_NAME }} || true
          
          # Restore previous .env if available
          if [ -f .env.bak.* ]; then
            LATEST_BACKUP=$(ls -t .env.bak.* | head -1)
            cp "$LATEST_BACKUP" .env
            echo "Restored .env from $LATEST_BACKUP"
          fi
          
          # Restore previous version marker
          if [ -f .deployed_version.backup ]; then
            cp .deployed_version.backup .deployed_version
          fi
          
          # Load environment
          set -a
          source .env
          set +a
          
          # Set rollback version
          export VERSION="${{ steps.get_rollback_version.outputs.rollback_version }}"
          export CONTAINER_NAME="${{ inputs.CONTAINER_NAME }}"
          export CONTAINER_PORT="${{ inputs.CONTAINER_PORT }}"
          export DOCKER_REGISTRY="${{ inputs.DOCKER_REGISTRY }}"
          export DOCKER_IMAGE_NAME="${{ inputs.DOCKER_IMAGE_NAME }}"
          export NETWORK_NAME="achilles-middleware-network"
          
          echo "Pulling previous image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}:${VERSION}"
          docker pull ${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}:${VERSION}
          
          # Start container with previous version
          docker run -d \
            --name ${CONTAINER_NAME} \
            --network ${NETWORK_NAME} \
            -p ${CONTAINER_PORT}:${CONTAINER_PORT} \
            --env-file .env \
            --restart unless-stopped \
            ${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}:${VERSION}
          
          echo "=== Rollback completed ==="
          echo "Rolled back to version: ${VERSION}"
          
          ENDSSH
          
      - name: Verify rollback health
        run: |
          echo "Waiting 30 seconds for rolled back container..."
          sleep 30
          
          for i in {1..10}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              "http://${{ secrets.SSH_IP }}:${{ inputs.CONTAINER_PORT }}${{ inputs.health_check_endpoint }}" || echo "000")
            
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Rollback successful - service is healthy"
              exit 0
            fi
            
            echo "Attempt $i: HTTP $HTTP_CODE"
            sleep 5
          done
          
          echo "::error::Rollback verification failed"
          exit 1